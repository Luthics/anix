name: CI

on:
  push:
    branches: [main, codex/rfc-conformance-v1.1]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: python3 scripts/rfc-test-index.py --check

  check-test:
    name: Clippy & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (-D warnings)
        run: cargo xclippy
      - name: Build workspace
        id: build
        run: cargo build --workspace
      - name: Smoke test binaries
        run: |
          ./target/debug/anix --version
          ./target/debug/anix-provider --version
          test "$(./target/debug/msh -c 'echo ok')" = "ok"
      - name: Install strace for Linux conformance tests
        if: runner.os == 'Linux'
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends strace
          fi
      - name: RFC provider and terminal conformance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rust workspace tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo xtest --no-fail-fast

      - name: Linux deadlines without pidfd_open
        if: ${{ runner.os == 'Linux' && !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          test_bin=$(cargo test --locked -p anix-core --test rfc_runtime --no-run --message-format=json |
            jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "rfc_runtime") | .executable | strings] | select(length == 1) | first')
          trace="$RUNNER_TEMP/anix-no-pidfd.trace"
          status=0
          strace -f -qq -o "$trace" -e trace=pidfd_open -e inject=pidfd_open:error=ENOSYS \
            "$test_bin" --test-threads=1 --exact \
            hooks::on_exit_timeout_is_local_to_one_hook_and_preserves_the_primary_exit_code \
            signals::sigint_bounds_cleanup_of_a_provider_that_acknowledges_term \
            signals::sigterm_bounds_cleanup_of_a_provider_that_acknowledges_term || status=$?
          grep -q 'ENOSYS .*INJECTED' "$trace"
          exit "$status"

  linux-musl-static:
    name: Static Linux musl (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-x86_64
      - name: Build static release binaries
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --workspace --target x86_64-unknown-linux-musl
      - name: Verify static linkage and smoke test
        run: |
          BIN_DIR="target/x86_64-unknown-linux-musl/release"
          for bin in anix msh anix-provider aview aclr; do
            file "${BIN_DIR}/${bin}"
            if ldd "${BIN_DIR}/${bin}" 2>&1 | grep -q '=>'; then
              echo "ERROR: ${bin} is dynamically linked" >&2
              exit 1
            fi
          done
          "${BIN_DIR}/anix" --version
          "${BIN_DIR}/anix-provider" --version
          test "$("${BIN_DIR}/msh" -c 'echo static-ok')" = "static-ok"
