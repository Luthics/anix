name: CI

on:
  push:
    branches: [main, codex/rfc-conformance]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Check each test's RFC references
        run: python3 scripts/rfc-test-index.py --check

  check-test:
    name: Clippy & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (-D warnings)
        run: cargo xclippy
      - name: Unit and RFC tests
        run: cargo xtest --no-fail-fast
      # RFC §3.1, §7.1
      - name: Smoke test binaries
        run: |
          cargo build --workspace
          ./target/debug/agent --version
          test "$(./target/debug/msh -c 'echo ok')" = "ok"

      - name: Test installed five-binary pipeline
        if: ${{ !cancelled() }}
        run: python3 tests/test_distribution.py
      - name: Test agent and msh together
        if: ${{ !cancelled() }}
        run: |
          cargo build -p os-agent-core -p msh
          python3 tests/test_shell_pipeline.py

  linux-components:
    name: PDF rendering and Linux kernel fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils strace
      - run: cargo build -p agent-tools -p os-agent-core
      - run: python3 tests/test_pdf_pages.py
      - run: python3 tests/test_linux_fallback.py
        if: ${{ !cancelled() }}

  wsl2:
    name: RFC suites on WSL2
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: build-essential ca-certificates curl python3 poppler-utils strace
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export POSIX modes and line endings from Git
        run: git archive --format=tar --output=source.tar HEAD
      # RFC §10.2
      - name: Build on the WSL2 Linux filesystem
        shell: wsl-bash {0}
        run: |
          uname -r | grep -i 'microsoft.*wsl2'
          mkdir -p "$HOME/os-agent"
          tar xf source.tar -C "$HOME/os-agent"
          cd "$HOME/os-agent"
          curl -fsSLo /tmp/rustup-init https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --no-modify-path
          "$HOME/.cargo/bin/cargo" build --locked --workspace
      - name: Run Rust and executable suites
        shell: wsl-bash {0}
        run: |
          cd "$HOME/os-agent"
          export PATH="$HOME/.cargo/bin:$PATH"
          status=0
          cargo xtest --locked --no-fail-fast || status=1
          for suite in tests/test_*.py; do
            python3 "$suite" || status=1
          done
          exit "$status"

  linux-musl-static:
    name: Static Linux musl (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-x86_64
      - name: Build static release binaries
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --workspace --target x86_64-unknown-linux-musl
      # RFC §2, §3.1, §7.1
      - name: Verify static linkage and smoke test
        run: |
          BIN_DIR="target/x86_64-unknown-linux-musl/release"
          for bin in agent msh agent-provider-openai-responses aview aclr; do
            file "${BIN_DIR}/${bin}"
            readelf -lW "${BIN_DIR}/${bin}" > "${RUNNER_TEMP}/program-headers"
            readelf -dW "${BIN_DIR}/${bin}" > "${RUNNER_TEMP}/dynamic-section"
            if grep -qw INTERP "${RUNNER_TEMP}/program-headers" || grep -q '(NEEDED)' "${RUNNER_TEMP}/dynamic-section"; then
              echo "ERROR: ${bin} is dynamically linked" >&2
              exit 1
            fi
          done
          "${BIN_DIR}/agent" --version
          test "$("${BIN_DIR}/msh" -c 'echo static-ok')" = "static-ok"
